name: Ingest Events

on:
  schedule:
    # Weekly fallback only (Sun 21:00 IST = 15:30 UTC). Runs Discourse-only —
    # District's API geoblocks GitHub's non-India runners. The daily, District-
    # enriched build runs locally via launchd (see ops/publish-local.sh).
    - cron: "30 15 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node src/build.js
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: events-latest
          name: Latest Community Events
          files: |
            improvlore.json
            mtg.json
      - name: Trigger Cloudflare Pages rebuild
        run: curl -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
