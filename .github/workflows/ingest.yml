name: Ingest Events

on:
  schedule:
    # Nightly publish at 00:00 IST (= 18:30 UTC; GitHub cron is UTC). District
    # enrichment now works on GitHub runners (we read the un-geoblocked event
    # pages, not the geoblocked API), so this is a full District-enriched build.
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and upload JSON only — skip the release and Cloudflare deploy"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node src/build.js

      # Always grab the built JSON on a manual run so a dry run is inspectable
      # (download from the run's Artifacts section). Costs nothing on schedule.
      - name: Upload built event JSON
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: event-json
          path: |
            improvlore.json
            mtg.json
            eleven-am-club.json

      # Publish + deploy are skipped on a dry run. dry_run is unset for the
      # scheduled event, so the '!= true' guard keeps the weekly publish live.
      - name: Publish release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: events-latest
          name: Latest Community Events
          files: |
            improvlore.json
            mtg.json
            eleven-am-club.json
      - name: Trigger Cloudflare Pages rebuild
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: curl -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
