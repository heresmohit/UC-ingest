name: Ingest Events

on:
  workflow_dispatch:
    inputs:
      publish_site:
        description: "Also publish GitHub release and trigger Cloudflare Pages rebuild"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download blr.today dataset
        run: curl -fsSL -o events.db https://github.com/blr-today/dataset/releases/latest/download/events.db
      - name: Run tests
        run: npm test
      - name: Build events
        run: node src/build.js
      - name: Sync improvlore to D1
        run: node src/sync-d1.js
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Publish release
        if: ${{ github.event.inputs.publish_site == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: events-latest
          name: Latest Community Events
          files: improvlore.json
      - name: Trigger Cloudflare Pages rebuild
        if: ${{ github.event.inputs.publish_site == 'true' }}
        run: curl -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
